<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360">
<defs>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffb3d4"/><stop offset="0.5" stop-color="#f585b5"/><stop offset="1" stop-color="#e05f9c"/>
</linearGradient>
<linearGradient id="hairShade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e86fa6"/><stop offset="1" stop-color="#c94585"/>
</linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff0e2"/><stop offset="1" stop-color="#f9d0b8"/>
</linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ff8fc0"/><stop offset="0.55" stop-color="#e5468f"/><stop offset="1" stop-color="#8e2f6b"/>
</linearGradient>
<linearGradient id="uniform" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe4f0"/>
</linearGradient>
<linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ff86b8"/><stop offset="1" stop-color="#e04d8a"/>
</linearGradient>
</defs>

<g stroke="#2a1a2e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

<!-- hair back -->
<path d="M150 36 C 78 36 44 92 46 168 C 47 214 60 258 88 280 C 104 292 120 292 150 292 C 180 292 196 292 212 280 C 240 258 253 214 254 168 C 256 92 222 36 150 36 Z" fill="url(#hairShade)"/>

<!-- cat ears -->
<path d="M78 92 L58 26 L128 70 Z" fill="url(#hair)"/>
<path d="M222 92 L242 26 L172 70 Z" fill="url(#hair)"/>
<path d="M85 78 L72 44 L110 70 Z" fill="#ff9dc4" stroke-width="3"/>
<path d="M215 78 L228 44 L190 70 Z" fill="#ff9dc4" stroke-width="3"/>

<!-- face -->
<ellipse cx="150" cy="158" rx="84" ry="90" fill="url(#skin)"/>

<!-- bangs -->
<path d="M70 140 C 66 82 104 52 150 52 C 196 52 234 82 230 140 C 218 118 204 108 190 104 C 186 124 172 140 156 146 C 160 126 156 112 150 104 C 142 124 128 140 110 146 C 112 124 104 112 96 104 C 84 112 76 124 70 140 Z" fill="url(#hair)"/>
<path d="M73 132 C 76 100 92 76 118 64 C 104 84 96 108 96 132 Z" fill="#ffc4dc" stroke="none" opacity="0.7"/>

<!-- eyes -->
<ellipse cx="113" cy="170" rx="27" ry="33" fill="#ffffff"/>
<ellipse cx="187" cy="170" rx="27" ry="33" fill="#ffffff"/>
<ellipse cx="115" cy="174" rx="20" ry="27" fill="url(#iris)" stroke-width="3"/>
<ellipse cx="185" cy="174" rx="20" ry="27" fill="url(#iris)" stroke-width="3"/>
<ellipse cx="115" cy="176" rx="10" ry="17" fill="#2a1230" stroke="none"/>
<ellipse cx="185" cy="176" rx="10" ry="17" fill="#2a1230" stroke="none"/>
<circle cx="108" cy="164" r="8" fill="#ffffff" stroke="none"/>
<circle cx="178" cy="164" r="8" fill="#ffffff" stroke="none"/>
<circle cx="122" cy="185" r="4" fill="#ffffff" stroke="none" opacity="0.85"/>
<circle cx="192" cy="185" r="4" fill="#ffffff" stroke="none" opacity="0.85"/>
<path d="M84 150 Q113 130 142 150" fill="none" stroke-width="6"/>
<path d="M158 150 Q187 130 216 150" fill="none" stroke-width="6"/>
<path d="M84 150 L78 140 M142 150 L148 140 M158 150 L152 140 M216 150 L222 140" fill="none" stroke-width="4"/>
<path d="M98 138 Q113 130 130 136 M170 136 Q187 130 202 138" fill="none" stroke-width="3"/>

<!-- blush -->
<ellipse cx="92" cy="204" rx="17" ry="9" fill="#ff9ab8" stroke="none" opacity="0.75"/>
<ellipse cx="208" cy="204" rx="17" ry="9" fill="#ff9ab8" stroke="none" opacity="0.75"/>
<g stroke="#ff6f9c" stroke-width="2.5" opacity="0.8">
<path d="M84 202 l-4 5 M94 200 l-4 6 M104 202 l-4 5" fill="none"/>
<path d="M196 202 l-4 5 M206 200 l-4 6 M216 202 l-4 5" fill="none"/>
</g>
<!-- nose + mouth -->
<circle cx="150" cy="198" r="2.5" fill="#d98a94" stroke="none"/>
<path d="M136 212 Q150 228 164 212" fill="none" stroke-width="4"/>
<path d="M143 218 Q150 224 157 218" fill="#ff6f9c" stroke="none"/>

<!-- body: sailor uniform -->
<path d="M104 246 Q150 232 196 246 L200 300 L100 300 Z" fill="url(#uniform)"/>
<!-- sailor collar -->
<path d="M104 246 L150 268 L196 246 L192 270 L150 292 L108 270 Z" fill="url(#pink)"/>
<path d="M108 270 L150 292 L192 270" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<!-- bow -->
<path d="M150 274 C 128 258 118 274 134 286 L150 280 Z" fill="#ff7cb0"/>
<path d="M150 274 C 172 258 182 274 166 286 L150 280 Z" fill="#ff7cb0"/>
<circle cx="150" cy="278" r="7" fill="#ffd2e5"/>
<!-- skirt -->
<path d="M100 296 L200 296 L232 338 Q150 352 68 338 Z" fill="url(#uniform)"/>
<path d="M112 300 L104 338 M137 300 L134 342 M163 300 L166 342 M188 300 L196 338" fill="none" stroke="#c9cfe0" stroke-width="3"/>
<!-- legs -->
<rect x="116" y="338" width="22" height="16" rx="6" fill="url(#skin)"/>
<rect x="162" y="338" width="22" height="16" rx="6" fill="url(#skin)"/>
<ellipse cx="126" cy="354" rx="17" ry="9" fill="#6b4a8f"/>
<ellipse cx="174" cy="354" rx="17" ry="9" fill="#6b4a8f"/>
<!-- left arm down -->
<path d="M104 252 C 84 260 76 286 82 306 L100 304 C 98 288 104 272 114 266 Z" fill="url(#uniform)"/>
<circle cx="90" cy="308" r="13" fill="url(#skin)"/>
<!-- right arm waving -->
<path d="M196 250 C 218 244 232 222 236 200 L220 194 C 214 214 204 228 190 234 Z" fill="url(#uniform)"/>
<circle cx="230" cy="190" r="16" fill="url(#skin)"/>
<path d="M226 178 q4 -10 9 -2 M236 180 q6 -8 9 0 M242 190 q8 -4 7 4" fill="none" stroke-width="4"/>

</g>
<!-- non-outlined sparkle accents -->
<g fill="#ffffff" opacity="0.9">
<path d="M60 120 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
<path d="M244 250 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>
</g>
</svg>
