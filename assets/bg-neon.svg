<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0b0a2a"/>
<stop offset="0.5" stop-color="#241a5a"/>
<stop offset="0.78" stop-color="#4b2470"/>
<stop offset="1" stop-color="#7a2c6e"/>
</linearGradient>
<linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1a1642"/>
<stop offset="1" stop-color="#0d0a24"/>
</linearGradient>
<linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a1d55"/>
<stop offset="1" stop-color="#150f36"/>
</linearGradient>
<linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a1c4a"/>
<stop offset="0.5" stop-color="#160f30"/>
<stop offset="1" stop-color="#0a071c"/>
</linearGradient>
<linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#39f0ff" stop-opacity="0.9"/>
<stop offset="1" stop-color="#0aa7d8" stop-opacity="0.7"/>
</linearGradient>
<linearGradient id="magGlow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ff5bd0" stop-opacity="0.9"/>
<stop offset="1" stop-color="#c2188f" stop-opacity="0.7"/>
</linearGradient>
<linearGradient id="reflCyan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#39f0ff" stop-opacity="0.5"/>
<stop offset="1" stop-color="#39f0ff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="reflMag" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ff5bd0" stop-opacity="0.5"/>
<stop offset="1" stop-color="#ff5bd0" stop-opacity="0"/>
</linearGradient>
<radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#eef4ff" stop-opacity="0.9"/>
<stop offset="0.4" stop-color="#bcd0ff" stop-opacity="0.4"/>
<stop offset="1" stop-color="#bcd0ff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="haze" cx="50%" cy="100%" r="80%">
<stop offset="0" stop-color="#ff4fb8" stop-opacity="0.35"/>
<stop offset="1" stop-color="#ff4fb8" stop-opacity="0"/>
</radialGradient>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>

<!-- stars -->
<g fill="#ffffff">
<circle cx="120" cy="90" r="2"/><circle cx="260" cy="160" r="1.6"/><circle cx="360" cy="70" r="2.2"/>
<circle cx="500" cy="130" r="1.4"/><circle cx="620" cy="60" r="1.8"/><circle cx="720" cy="150" r="2"/>
<circle cx="880" cy="80" r="1.5"/><circle cx="980" cy="140" r="2.2"/><circle cx="1120" cy="60" r="1.6"/>
<circle cx="1260" cy="120" r="2"/><circle cx="1380" cy="70" r="1.5"/><circle cx="1500" cy="150" r="2.2"/>
<circle cx="180" cy="220" r="1.4"/><circle cx="840" cy="200" r="1.6"/><circle cx="1440" cy="230" r="1.4"/>
</g>
<g fill="#9fe8ff" opacity="0.8">
<circle cx="420" cy="100" r="1.4"/><circle cx="1060" cy="110" r="1.4"/><circle cx="1320" cy="180" r="1.4"/>
</g>

<!-- moon -->
<circle cx="1320" cy="150" r="140" fill="url(#moonGlow)"/>
<circle cx="1320" cy="150" r="58" fill="#eef2ff"/>
<circle cx="1298" cy="134" r="10" fill="#cdd6f0" opacity="0.7"/>
<circle cx="1338" cy="166" r="7" fill="#cdd6f0" opacity="0.7"/>
<circle cx="1320" cy="116" r="5" fill="#cdd6f0" opacity="0.7"/>

<!-- city glow haze -->
<rect x="0" y="480" width="1600" height="420" fill="url(#haze)"/>

<!-- BACKGROUND BUILDINGS -->
<g fill="url(#bldg2)">
<rect x="40" y="300" width="200" height="620"/>
<rect x="250" y="220" width="170" height="700"/>
<rect x="430" y="360" width="140" height="560"/>
<rect x="980" y="260" width="180" height="660"/>
<rect x="1170" y="340" width="150" height="580"/>
<rect x="1330" y="240" width="230" height="680"/>
</g>
<!-- lit windows far -->
<g fill="#ffd98a" opacity="0.75">
<rect x="60" y="330" width="12" height="16"/><rect x="90" y="330" width="12" height="16"/><rect x="150" y="330" width="12" height="16"/><rect x="200" y="330" width="12" height="16"/>
<rect x="60" y="370" width="12" height="16"/><rect x="120" y="370" width="12" height="16"/><rect x="180" y="370" width="12" height="16"/>
<rect x="270" y="250" width="12" height="16"/><rect x="310" y="250" width="12" height="16"/><rect x="370" y="250" width="12" height="16"/>
<rect x="270" y="290" width="12" height="16"/><rect x="350" y="290" width="12" height="16"/><rect x="390" y="290" width="12" height="16"/>
<rect x="1000" y="290" width="12" height="16"/><rect x="1040" y="290" width="12" height="16"/><rect x="1100" y="290" width="12" height="16"/>
<rect x="1000" y="330" width="12" height="16"/><rect x="1060" y="330" width="12" height="16"/>
<rect x="1350" y="270" width="12" height="16"/><rect x="1400" y="270" width="12" height="16"/><rect x="1480" y="270" width="12" height="16"/>
<rect x="1350" y="310" width="12" height="16"/><rect x="1440" y="310" width="12" height="16"/><rect x="1520" y="310" width="12" height="16"/>
</g>
<g fill="#6fd8ff" opacity="0.6">
<rect x="120" y="330" width="12" height="16"/><rect x="200" y="370" width="12" height="16"/>
<rect x="310" y="290" width="12" height="16"/><rect x="1100" y="330" width="12" height="16"/>
<rect x="1400" y="310" width="12" height="16"/>
</g>

<!-- FOREGROUND BUILDINGS framing the street -->
<g fill="url(#bldg)">
<path d="M0 260 L330 300 L360 900 L0 900 Z"/>
<path d="M1600 220 L1290 290 L1250 900 L1600 900 Z"/>
</g>
<!-- neon vertical signs on left building -->
<g>
<rect x="70" y="330" width="46" height="230" rx="8" fill="#101033" stroke="#39f0ff" stroke-width="4"/>
<rect x="80" y="345" width="26" height="20" rx="4" fill="url(#cyanGlow)"/>
<rect x="80" y="380" width="26" height="20" rx="4" fill="url(#cyanGlow)"/>
<rect x="80" y="415" width="26" height="20" rx="4" fill="url(#cyanGlow)"/>
<rect x="80" y="450" width="26" height="20" rx="4" fill="url(#cyanGlow)"/>
<rect x="80" y="485" width="26" height="20" rx="4" fill="url(#cyanGlow)"/>
<rect x="150" y="400" width="38" height="170" rx="8" fill="#1a0c2e" stroke="#ff5bd0" stroke-width="4"/>
<rect x="160" y="415" width="18" height="18" rx="3" fill="url(#magGlow)"/>
<rect x="160" y="447" width="18" height="18" rx="3" fill="url(#magGlow)"/>
<rect x="160" y="479" width="18" height="18" rx="3" fill="url(#magGlow)"/>
<rect x="160" y="511" width="18" height="18" rx="3" fill="url(#magGlow)"/>
<rect x="240" y="360" width="70" height="26" rx="6" fill="#100f2e" stroke="#ffd23f" stroke-width="3"/>
<rect x="248" y="367" width="54" height="12" rx="3" fill="#ffe27a" opacity="0.9"/>
</g>
<!-- neon vertical signs on right building -->
<g>
<rect x="1490" y="320" width="46" height="250" rx="8" fill="#101033" stroke="#ff5bd0" stroke-width="4"/>
<rect x="1500" y="336" width="26" height="20" rx="4" fill="url(#magGlow)"/>
<rect x="1500" y="372" width="26" height="20" rx="4" fill="url(#magGlow)"/>
<rect x="1500" y="408" width="26" height="20" rx="4" fill="url(#magGlow)"/>
<rect x="1500" y="444" width="26" height="20" rx="4" fill="url(#magGlow)"/>
<rect x="1500" y="480" width="26" height="20" rx="4" fill="url(#magGlow)"/>
<rect x="1410" y="380" width="36" height="180" rx="8" fill="#0c182e" stroke="#39f0ff" stroke-width="4"/>
<rect x="1420" y="395" width="16" height="18" rx="3" fill="url(#cyanGlow)"/>
<rect x="1420" y="428" width="16" height="18" rx="3" fill="url(#cyanGlow)"/>
<rect x="1420" y="461" width="16" height="18" rx="3" fill="url(#cyanGlow)"/>
<rect x="1420" y="494" width="16" height="18" rx="3" fill="url(#cyanGlow)"/>
<rect x="1330" y="350" width="70" height="26" rx="6" fill="#1a0a26" stroke="#7dff9b" stroke-width="3"/>
<rect x="1338" y="357" width="54" height="12" rx="3" fill="#aaffbd" opacity="0.9"/>
</g>

<!-- horizontal neon strips / cables across street -->
<g fill="none" stroke-linecap="round">
<path d="M360 430 Q800 470 1250 420" stroke="#ff5bd0" stroke-width="6" opacity="0.85"/>
<path d="M360 470 Q800 510 1250 460" stroke="#39f0ff" stroke-width="5" opacity="0.8"/>
<path d="M380 520 Q800 550 1230 510" stroke="#ffd23f" stroke-width="4" opacity="0.7"/>
</g>
<!-- hanging lanterns -->
<g>
<circle cx="560" cy="476" r="16" fill="#ff6a4d"/><circle cx="560" cy="476" r="7" fill="#ffe08a" opacity="0.9"/>
<circle cx="800" cy="492" r="16" fill="#ff5bd0"/><circle cx="800" cy="492" r="7" fill="#ffe08a" opacity="0.9"/>
<circle cx="1040" cy="478" r="16" fill="#39f0ff"/><circle cx="1040" cy="478" r="7" fill="#eaffff" opacity="0.9"/>
</g>

<!-- WET STREET -->
<path d="M360 600 L1250 600 L1600 900 L0 900 Z" fill="url(#street)"/>
<!-- reflections -->
<g opacity="0.65">
<path d="M70 560 L120 560 L150 900 L20 900 Z" fill="url(#reflCyan)"/>
<path d="M150 570 L188 570 L230 900 L120 900 Z" fill="url(#reflMag)"/>
<path d="M1490 570 L1536 570 L1580 900 L1450 900 Z" fill="url(#reflMag)"/>
<path d="M1410 560 L1446 560 L1490 900 L1380 900 Z" fill="url(#reflCyan)"/>
<path d="M540 600 L580 600 L600 900 L470 900 Z" fill="url(#reflMag)" opacity="0.6"/>
<path d="M780 600 L820 600 L860 900 L730 900 Z" fill="url(#reflMag)" opacity="0.6"/>
<path d="M1020 600 L1060 600 L1100 900 L970 900 Z" fill="url(#reflCyan)" opacity="0.6"/>
</g>
<!-- wet streaks -->
<g stroke="#8fb6ff" stroke-width="2" opacity="0.25">
<path d="M300 660 L320 900"/><path d="M480 640 L500 900"/><path d="M700 650 L690 900"/>
<path d="M920 640 L940 900"/><path d="M1140 660 L1120 900"/><path d="M1340 650 L1360 900"/>
</g>
<!-- puddle highlights -->
<g fill="#bcd6ff" opacity="0.18">
<ellipse cx="500" cy="780" rx="120" ry="10"/><ellipse cx="1080" cy="820" rx="150" ry="12"/>
<ellipse cx="800" cy="740" rx="100" ry="8"/>
</g>

<!-- small silhouetted figure with umbrella at center distance -->
<g fill="#080614" opacity="0.92">
<ellipse cx="800" cy="600" rx="34" ry="10"/>
<path d="M800 560 q-38 26 -38 40 h76 q0 -14 -38 -40 Z"/>
<rect x="798" y="598" width="4" height="34"/>
<path d="M796 632 l-8 26 h6 l8 -22 Z M804 632 l8 26 h-6 l-8 -22 Z"/>
</g>
</svg>
