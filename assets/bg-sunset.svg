<!-- birds -->
<g fill="none" stroke="#3a2a4d" stroke-width="3" stroke-linecap="round" opacity="0.8">
<path d="M430 250 q12 -12 24 0 q12 -12 24 0"/>
<path d="M500 225 q9 -9 18 0 q9 -9 18 0"/>
<path d="M1240 260 q10 -10 20 0 q10 -10 20 0"/>
</g>

<!-- far skyline -->
<path d="M0 560 L0 505 L60 505 L60 470 L110 470 L110 520 L170 520 L170 480 L230 480 L230 530 L300 530 L300 490 L360 490 L360 540 L430 540 L430 500 L500 500 L500 545 L580 545 L580 510 L650 510 L650 555 L730 555 L730 520 L800 520 L800 560 L880 560 L880 515 L950 515 L950 548 L1030 548 L1030 500 L1100 500 L1100 540 L1180 540 L1180 505 L1250 505 L1250 550 L1320 550 L1320 495 L1390 495 L1390 535 L1460 535 L1460 510 L1530 510 L1530 548 L1600 548 L1600 900 L0 900 Z" fill="url(#cityFar)" opacity="0.78"/>

