<rect x="480" y="580" width="10" height="14"/><rect x="500" y="580" width="10" height="14"/><rect x="480" y="600" width="10" height="14"/>
<rect x="660" y="590" width="10" height="14"/><rect x="680" y="590" width="10" height="14"/>
<rect x="760" y="585" width="10" height="14"/><rect x="840" y="592" width="10" height="14"/><rect x="860" y="592" width="10" height="14"/>
<rect x="1020" y="580" width="10" height="14"/><rect x="1040" y="580" width="10" height="14"/><rect x="1020" y="602" width="10" height="14"/>
<rect x="1190" y="585" width="10" height="14"/><rect x="1210" y="585" width="10" height="14"/>
<rect x="1370" y="575" width="10" height="14"/><rect x="1390" y="575" width="10" height="14"/><rect x="1370" y="597" width="10" height="14"/>
<rect x="1540" y="590" width="10" height="14"/>
</g>
<g fill="#ffb060" opacity="0.6">
