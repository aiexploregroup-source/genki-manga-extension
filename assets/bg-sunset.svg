<path d="M0 470 Q 400 520 800 500 Q 1200 480 1600 520" stroke-width="3"/>
<path d="M0 500 Q 400 550 800 530 Q 1200 510 1600 550" stroke-width="2.5"/>
<path d="M120 445 L120 640" stroke-width="6"/><path d="M1380 455 L1380 640" stroke-width="6"/>
<path d="M90 470 L150 470 M1350 480 L1410 480" stroke-width="6"/>
</g>

<!-- balcony railing foreground -->
<g fill="url(#rail)">
<rect x="0" y="770" width="1600" height="20"/>
<rect x="0" y="855" width="1600" height="14"/>
<rect x="40" y="770" width="14" height="130"/><rect x="170" y="770" width="14" height="130"/>
<rect x="300" y="770" width="14" height="130"/><rect x="430" y="770" width="14" height="130"/>
<rect x="560" y="770" width="14" height="130"/><rect x="690" y="770" width="14" height="130"/>
<rect x="820" y="770" width="14" height="130"/><rect x="950" y="770" width="14" height="130"/>
<rect x="1080" y="770" width="14" height="130"/><rect x="1210" y="770" width="14" height="130"/>
<rect x="1340" y="770" width="14" height="130"/><rect x="1470" y="770" width="14" height="130"/>
</g>
<rect x="0" y="760" width="1600" height="12" fill="#3a2a50"/>
<rect x="0" y="778" width="1600" height="4" fill="#5a4068" opacity="0.5"/>

<!-- final warm haze -->
<rect width="1600" height="900" fill="url(#sunGlow)" opacity="0.12"/>
