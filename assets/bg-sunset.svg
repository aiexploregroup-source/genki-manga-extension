<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#31275e"/>
<stop offset="0.32" stop-color="#6d4a88"/>
<stop offset="0.6" stop-color="#d96a72"/>
<stop offset="0.82" stop-color="#ff9d5c"/>
<stop offset="1" stop-color="#ffcf7a"/>
</linearGradient>
<radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#fff4c2" stop-opacity="1"/>
<stop offset="0.3" stop-color="#ffca6a" stop-opacity="0.85"/>
<stop offset="0.7" stop-color="#ff8a52" stop-opacity="0.35"/>
<stop offset="1" stop-color="#ff7a4d" stop-opacity="0"/>
</radialGradient>
<linearGradient id="sunCore" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff7d0"/>
<stop offset="1" stop-color="#ffb457"/>
</linearGradient>
<linearGradient id="warmCloud" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffd9a0"/>
<stop offset="1" stop-color="#ef8a76"/>
</linearGradient>
<linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#b06a8e"/>
<stop offset="1" stop-color="#7c4a73"/>
</linearGradient>
<linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4a3566"/>
<stop offset="1" stop-color="#2a1f45"/>
</linearGradient>
<linearGradient id="cityFar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8a5a80"/>
<stop offset="1" stop-color="#63446e"/>
</linearGradient>
<linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#241a3a"/>
<stop offset="1" stop-color="#120c22"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="800" cy="470" r="400" fill="url(#sunGlow)"/>
<circle cx="800" cy="470" r="150" fill="url(#sunCore)"/>
<circle cx="800" cy="470" r="150" fill="none" stroke="#fff0bb" stroke-width="3" opacity="0.6"/>

<!-- high wispy clouds -->
<g fill="url(#cloudDark)" opacity="0.55">
<ellipse cx="260" cy="150" rx="200" ry="26"/><ellipse cx="420" cy="120" rx="150" ry="20"/>
<ellipse cx="1180" cy="130" rx="220" ry="24"/><ellipse cx="1380" cy="180" rx="160" ry="20"/>
<ellipse cx="700" cy="90" rx="180" ry="18"/>
</g>
<!-- warm sunset clouds -->
<g fill="url(#warmCloud)" opacity="0.92">
<ellipse cx="300" cy="330" rx="200" ry="38"/><ellipse cx="210" cy="315" rx="120" ry="34"/><ellipse cx="400" cy="318" rx="110" ry="30"/>
<ellipse cx="560" cy="385" rx="170" ry="30" opacity="0.85"/>
<ellipse cx="1280" cy="350" rx="220" ry="40"/><ellipse cx="1400" cy="332" rx="130" ry="34"/><ellipse cx="1180" cy="338" rx="120" ry="30"/>
<ellipse cx="1050" cy="410" rx="160" ry="28" opacity="0.8"/>
<ellipse cx="820" cy="300" rx="130" ry="22" opacity="0.7"/>
</g>
<g fill="#ffd9a0" opacity="0.5">
<ellipse cx="480" cy="440" rx="150" ry="18"/><ellipse cx="1120" cy="455" rx="170" ry="16"/>
<ellipse cx="800" cy="520" rx="260" ry="14"/>
