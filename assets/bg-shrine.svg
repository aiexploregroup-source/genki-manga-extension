</g>
<!-- gate 4 -->
<g>
<rect x="680" y="372" width="10" height="270" fill="url(#toriiDark)"/><rect x="910" y="372" width="10" height="270" fill="url(#toriiDark)"/>
<path d="M662 372 Q800 358 938 372 L933 384 Q800 368 667 384 Z" fill="url(#torii)"/>
