<ellipse cx="90" cy="300" rx="150" ry="120"/><ellipse cx="220" cy="360" rx="130" ry="100"/>
<ellipse cx="60" cy="450" rx="140" ry="100"/><ellipse cx="1510" cy="290" rx="150" ry="120"/>
<ellipse cx="1380" cy="350" rx="130" ry="100"/><ellipse cx="1540" cy="450" rx="140" ry="100"/>
