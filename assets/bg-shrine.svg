<g>
<rect x="370" y="170" width="26" height="730" fill="url(#toriiDark)"/><rect x="1204" y="170" width="26" height="730" fill="url(#toriiDark)"/>
<path d="M324 170 Q800 132 1276 170 L1262 204 Q800 160 338 204 Z" fill="url(#torii)"/>
<rect x="352" y="216" width="896" height="34" fill="url(#torii)"/>
<rect x="700" y="180" width="200" height="70" fill="#a83227"/>
<rect x="722" y="196" width="156" height="40" fill="#c84132" opacity="0.7"/>
