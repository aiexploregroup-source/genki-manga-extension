<rect x="-22" y="50" width="44" height="12"/>
<path d="M-26 48 L0 18 L26 48 Z" fill="#7d7d70"/>
<rect x="-16" y="-6" width="32" height="26" fill="#c9b98f"/>
<path d="M-24 -8 L0 -34 L24 -8 Z" fill="#7d7d70"/>
<circle cx="0" cy="7" r="7" fill="#ffdf8c" stroke="none"/>
</g>
<g transform="translate(1300 640)">
<rect x="-9" y="60" width="18" height="70" fill="#8a8a7c"/>
<rect x="-22" y="50" width="44" height="12"/>
<path d="M-26 48 L0 18 L26 48 Z" fill="#7d7d70"/>
<rect x="-16" y="-6" width="32" height="26" fill="#c9b98f"/>
<path d="M-24 -8 L0 -34 L24 -8 Z" fill="#7d7d70"/>
<circle cx="0" cy="7" r="7" fill="#ffdf8c" stroke="none"/>
</g>
<g transform="translate(560 540) scale(0.62)">
<rect x="-9" y="60" width="18" height="70" fill="#8a8a7c"/>
<rect x="-22" y="50" width="44" height="12"/>
<path d="M-26 48 L0 18 L26 48 Z" fill="#7d7d70"/>
<rect x="-16" y="-6" width="32" height="26" fill="#c9b98f"/>
<path d="M-24 -8 L0 -34 L24 -8 Z" fill="#7d7d70"/>
<circle cx="0" cy="7" r="7" fill="#ffdf8c" stroke="none"/>
</g>
<g transform="translate(1040 540) scale(0.62)">
<rect x="-9" y="60" width="18" height="70" fill="#8a8a7c"/>
<rect x="-22" y="50" width="44" height="12"/>
<path d="M-26 48 L0 18 L26 48 Z" fill="#7d7d70"/>
<rect x="-16" y="-6" width="32" height="26" fill="#c9b98f"/>
<path d="M-24 -8 L0 -34 L24 -8 Z" fill="#7d7d70"/>
<circle cx="0" cy="7" r="7" fill="#ffdf8c" stroke="none"/>
</g>
</g>

<!-- TORII GATES: far to near -->
<g>
<!-- gate 8 (tiny) -->
<g opacity="0.9">
<rect x="786" y="438" width="4" height="40" fill="url(#toriiDark)"/><rect x="810" y="438" width="4" height="40" fill="url(#toriiDark)"/>
<path d="M780 438 Q800 432 820 438 L819 442 Q800 437 781 442 Z" fill="url(#torii)"/>
<rect x="783" y="446" width="34" height="3" fill="url(#torii)"/>
