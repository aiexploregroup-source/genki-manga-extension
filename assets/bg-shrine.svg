<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffd98a"/>
<stop offset="0.45" stop-color="#ffe9b8"/>
<stop offset="1" stop-color="#fff4d8"/>
</linearGradient>
<radialGradient id="sunBurst" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#fff8d8" stop-opacity="1"/>
<stop offset="0.5" stop-color="#ffe49a" stop-opacity="0.6"/>
<stop offset="1" stop-color="#ffe49a" stop-opacity="0"/>
</radialGradient>
<linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4e7a46"/>
<stop offset="1" stop-color="#24421f"/>
</linearGradient>
<linearGradient id="forestFar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7fa070"/>
<stop offset="1" stop-color="#4d6f45"/>
</linearGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8cae6a"/>
<stop offset="1" stop-color="#5a7a3f"/>
</linearGradient>
<linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d9cba6"/>
<stop offset="1" stop-color="#b6a37a"/>
</linearGradient>
<linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f0553f"/>
<stop offset="1" stop-color="#c5362a"/>
</linearGradient>
<linearGradient id="toriiDark" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#c23a2c"/>
<stop offset="1" stop-color="#8f271f"/>
</linearGradient>
<linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff6cf" stop-opacity="0.65"/>
<stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
</linearGradient>
<radialGradient id="leaf" cx="50%" cy="35%" r="65%">
<stop offset="0" stop-color="#6f9c55"/>
<stop offset="1" stop-color="#3c6330"/>
</radialGradient>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="800" cy="250" r="420" fill="url(#sunBurst)"/>
<circle cx="800" cy="250" r="95" fill="#fff6cf" opacity="0.85"/>

<!-- distant hills / forest line -->
<path d="M0 500 Q 250 410 500 480 T 1100 470 T 1600 490 L1600 700 L0 700 Z" fill="url(#forestFar)" opacity="0.8"/>

<!-- light rays through trees -->
<g fill="url(#ray)">
<path d="M770 60 L900 60 L1040 780 L700 780 Z" opacity="0.55"/>
<path d="M600 40 L680 40 L520 700 L360 700 Z" opacity="0.35"/>
<path d="M960 50 L1040 50 L1240 720 L1080 720 Z" opacity="0.35"/>
<path d="M430 80 L490 80 L260 640 L140 640 Z" opacity="0.25"/>
<path d="M1150 70 L1210 70 L1460 660 L1330 660 Z" opacity="0.25"/>
</g>

<!-- ground -->
<rect x="0" y="500" width="1600" height="400" fill="url(#ground)"/>

<!-- stone path receding to shrine -->
<path d="M770 470 L830 470 L1280 900 L320 900 Z" fill="url(#path)"/>
<g fill="#9d8a63" opacity="0.4">
<path d="M780 500 L820 500 L840 530 L760 530 Z"/>
