</g>

<!-- foreground trees framing -->
<g>
<path d="M0 900 L0 300 Q120 340 180 480 Q230 600 260 900 Z" fill="url(#forest)"/>
<path d="M1600 900 L1600 280 Q1480 330 1420 470 Q1370 600 1340 900 Z" fill="url(#forest)"/>
