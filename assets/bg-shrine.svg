<g fill="#8fb56a" opacity="0.55">
<circle cx="120" cy="280" r="16"/><circle cx="200" cy="340" r="12"/><circle cx="80" cy="420" r="14"/>
<circle cx="1480" cy="280" r="16"/><circle cx="1400" cy="340" r="12"/><circle cx="1520" cy="420" r="14"/>
</g>
</g>

<!-- floating pollen / light motes -->
<g fill="#fff6cf" opacity="0.75">
<circle cx="640" cy="300" r="4"/><circle cx="960" cy="260" r="3"/><circle cx="720" cy="420" r="3"/>
<circle cx="880" cy="380" r="4"/><circle cx="560" cy="500" r="3"/><circle cx="1040" cy="470" r="3"/><circle cx="800" cy="520" r="3"/>
